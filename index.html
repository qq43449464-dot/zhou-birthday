<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070403">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>周总，生日快乐 🎂</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E⭐%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/fonts.css?v=2">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div id="app">
  <canvas id="bgfx"></canvas>
  <div id="rotate">📱 竖屏体验更佳</div>
  <div id="stage">
    <div id="wall"></div>
    <div id="bokeh"></div>

    <div id="plank"></div>
    <div id="boy" class="sprite"><img src="assets/boy.png" alt="" draggable="false"></div>

    <div id="cake">
      <svg id="candleMain" viewBox="0 0 60 350" width="60" height="350">
        <defs>
          <linearGradient id="silver" x1="0" x2="1">
            <stop offset="0" stop-color="#8d96a0"/><stop offset=".5" stop-color="#f4f7fa"/><stop offset="1" stop-color="#7d8791"/>
          </linearGradient>
        </defs>
        <path d="M30 350 C 46 300, 12 270, 27 222 S 44 120, 30 72 S 27 24 30 10" fill="none" stroke="url(#silver)" stroke-width="7" stroke-linecap="round"/>
        <rect x="29" y="4" width="2" height="8" fill="#2a2a2a"/>
      </svg>
      <div id="miniCandles"></div>
      <svg id="cakeBody" viewBox="0 0 300 190" width="300" height="190">
        <defs>
          <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4ee"/><stop offset="1" stop-color="#f3d7cf"/></linearGradient>
          <radialGradient id="berry" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffc9c4"/><stop offset=".6" stop-color="#f69a98"/><stop offset="1" stop-color="#e57c82"/></radialGradient>
        </defs>
        <ellipse cx="150" cy="182" rx="140" ry="9" fill="rgba(0,0,0,.35)"/>
        <path d="M14 92 Q14 72 40 70 L260 70 Q286 72 286 92 L286 168 Q286 180 270 180 L30 180 Q14 180 14 168 Z" fill="url(#cream)"/>
        <path d="M14 92 q12 22 24 4 q12 24 26 2 q12 24 26 2 q12 22 26 2 q12 24 26 2 q12 22 26 2 q12 24 26 2 q12 22 26 2 q12 24 24 2 q8 -10 6 -14 L286 80 L14 80 Z" fill="#fff9f5"/>
        <g id="berries">
          <g transform="translate(70,58)"><path d="M0 -26 C24 -26 28 4 8 26 Q0 34 -8 26 C-28 4 -24 -26 0 -26Z" fill="url(#berry)"/><g fill="#fff0e6" opacity=".8"><circle cx="-8" cy="-10" r="1.6"/><circle cx="6" cy="-12" r="1.6"/><circle cx="-2" cy="0" r="1.6"/><circle cx="10" cy="2" r="1.6"/><circle cx="-12" cy="4" r="1.6"/><circle cx="0" cy="14" r="1.6"/></g><path d="M-12 -24 l12 6 l12 -6 l-6 10 l-12 0z" fill="#8fc77a"/></g>
          <g transform="translate(150,44)"><path d="M0 -26 C24 -26 28 4 8 26 Q0 34 -8 26 C-28 4 -24 -26 0 -26Z" fill="url(#berry)"/><g fill="#fff0e6" opacity=".8"><circle cx="-8" cy="-10" r="1.6"/><circle cx="6" cy="-12" r="1.6"/><circle cx="-2" cy="0" r="1.6"/><circle cx="10" cy="2" r="1.6"/><circle cx="-12" cy="4" r="1.6"/><circle cx="0" cy="14" r="1.6"/></g><path d="M-12 -24 l12 6 l12 -6 l-6 10 l-12 0z" fill="#8fc77a"/></g>
          <g transform="translate(228,58)"><path d="M0 -26 C24 -26 28 4 8 26 Q0 34 -8 26 C-28 4 -24 -26 0 -26Z" fill="url(#berry)"/><g fill="#fff0e6" opacity=".8"><circle cx="-8" cy="-10" r="1.6"/><circle cx="6" cy="-12" r="1.6"/><circle cx="-2" cy="0" r="1.6"/><circle cx="10" cy="2" r="1.6"/><circle cx="-12" cy="4" r="1.6"/><circle cx="0" cy="14" r="1.6"/></g><path d="M-12 -24 l12 6 l12 -6 l-6 10 l-12 0z" fill="#8fc77a"/></g>
        </g>
        <path d="M150 128 c-14 -14 -30 -2 -18 12 l18 16 l18 -16 c12 -14 -4 -26 -18 -12z" fill="#ff9fb0" opacity=".9"/>
        <path d="M20 168 q16 -10 32 0 q16 -10 32 0 q16 -10 32 0 q16 -10 32 0 q16 -10 32 0 q16 -10 32 0 q16 -10 32 0 q16 -10 32 0 q16 -10 28 0 v12 h-252z" fill="#fff9f5"/>
      </svg>
    </div>

    <div id="girl" class="sprite"><img src="assets/girl.png" alt="" draggable="false"></div>

    <canvas id="fx"></canvas>

    <div id="matchbox"><div class="strip"></div><span>MATCH</span></div>
    <div id="match"><i></i><b></b></div>
    <div id="shield">🤲</div>

    <div id="ui">
      <div id="title" class="hand"></div>
      <div id="wish" class="hand"><span class="wtxt">所有愿望都实现</span><em>Luck ♡</em></div>
      <div id="hint"></div>
      <div id="chapter"><div class="k"></div><div class="n hand"></div><div class="l"></div></div>
      <div id="narr"></div>
      <div id="meter"><i></i></div>
      <div id="counter"></div>
      <div id="lives"></div>
      <button id="btnSound" class="round">🔊</button>
      <div id="bubbles"></div>
      <div id="toast"></div>
      <div id="bubbleLayer"></div>
      <div id="tiger" class="hand">🐯</div>
      <div id="final" class="hidden">
        <div class="paper">
          <div class="ph hand">周总，生日快乐！</div>
          <div class="tags"><button id="tagScorpio" class="tag">♏ 天蝎座</button><button id="tagTiger" class="tag">🐯 属虎</button></div>
          <div class="date" id="bdate">1974 · 10 · 26</div>
          <div class="msg hand" id="finalMsg"></div>
          <img id="cardImg" alt="贺卡" class="hidden">
          <div class="row">
            <button class="pill small" id="btnSave">📷 生成贺卡</button>
            <button class="pill small" id="btnAgain">🔁 再玩一次</button>
          </div>
          <div class="tip" id="finalTip">点点 ♏ 和 🐯，还有惊喜 ✦</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/util.js?v=2"></script>
<script src="js/audio.js?v=2"></script>
<script src="js/fx.js?v=2"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
</body>
</html>
